name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".gitignore"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        run: rustup toolchain install

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Test
        run: make test
