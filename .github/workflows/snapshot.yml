name: Snapshot

on:
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  pre-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3

      - name: Test
        run: make test

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@v3.4.1

      - name: Compute the snapshot version
        id: version
        run: |
          set -euo pipefail
          version="$(svu patch)-snapshot.$(date -u +%Y%m%d%H%M%S)"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${version}")" ]; then
            echo "tag $version already exists on origin" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Snapshot: $version"

      - name: Publish the snapshot crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"$/s//version = \"${VERSION#v}\"/" Cargo.toml
          cargo update --workspace
          cargo publish -p yaml-dsl-compiler --allow-dirty

      - name: Tag and push the snapshot
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Snapshot $VERSION"
          git push origin "$VERSION"
