[package]
name = "mock-dsl-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An example caller of yaml-dsl-compiler: compiles a mock DSL into HCL."
publish = false

[dependencies]
ignore = "=0.4.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
yaml-dsl-compiler = { path = "../.." }
yaml-dsl-spec = "=0.0.1"
