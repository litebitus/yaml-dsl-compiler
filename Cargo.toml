[package]
name = "yaml-dsl-compiler"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "Compiles config-defined YAML DSLs into code: folds layers, expands macros, resolves references, and writes the target language."
readme = "README.md"
repository = "https://github.com/litebitus/yaml-dsl-compiler"
keywords = ["yaml", "dsl", "compiler", "hcl", "codegen"]
categories = ["compilers", "development-tools"]

[workspace]
members = ["examples/mock-dsl-compiler"]

[workspace.dependencies]
yaml-dsl-spec = "=0.2.0"

[dependencies]
fancy-regex = "0.20.0"
globset = "0.4.21"
rayon = "1.12.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
yaml-dsl-spec.workspace = true
